    eslint-config-next: "16.3.5"
    shadcn: "^4.21.0"
    turbo: "^2.11.2"

  typescript:
    "@types/katex": "^0.16.8"
    "@types/node": "^26.6.2"
    "@types/react": "^19.3.0"
    "@types/react-dom": "^19.3.0"
    typescript: "^7.0.2"

  ui:
    "@icons-pack/react-simple-icons": "^13.15.1"
    class-variance-authority: "^0.7.1"
    clsx: "^2.1.1"
